services:
  - type: web
    name: coffeebuds
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      # Postgres connection string (e.g. a free Neon database). Set it in the Render dashboard.
      # When unset the app falls back to SQLite, which Render's free tier wipes on every restart.
      - key: DATABASE_URL
        sync: false
